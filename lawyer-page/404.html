<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | HCM&amp;F Abogados</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Outfit:wght@300;400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#FDFBF7; --cream:#1A1613; --ink:#15110D; --muted:#6E6354; --ember:#A57C2A; --hairline:rgba(26,22,19,0.12); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Outfit',system-ui,sans-serif; background:var(--paper); color:var(--cream); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; position:relative; overflow:hidden; }
    body::before { content:''; position:absolute; inset:0; background:radial-gradient(900px 500px at 50% 30%, rgba(192,151,63,0.12), transparent 60%); pointer-events:none; }
    .wrap { position:relative; max-width:520px; }
    .code { font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ember); margin-bottom:28px; }
    h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:300; font-size:clamp(3rem,10vw,6rem); line-height:0.95; letter-spacing:-0.03em; margin-bottom:24px; }
    h1 i { font-style:italic; color:var(--ember); }
    p { color:var(--muted); font-size:1.05rem; line-height:1.7; margin-bottom:40px; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 24px; border-radius:999px; background:var(--ink); color:var(--paper); font-size:0.875rem; font-weight:500; text-decoration:none; transition:background 0.3s,transform 0.3s; }
    .btn:hover { background:var(--ember); transform:translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">Error 404</div>
    <h1>Página<br>no <i>encontrada.</i></h1>
    <p>La página que buscas no existe o fue movida. Vuelve al inicio para continuar.</p>
    <a href="/" class="btn">Volver al inicio &rarr;</a>
  </div>
</body>
</html>
